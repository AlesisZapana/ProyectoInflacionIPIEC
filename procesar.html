<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Procesar Imágenes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css"/>
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">
            <i class="bi bi-image"></i> Procesar Imágenes
        </h2>

        <button class="btn btn-secondary flex-fill" onclick="window.location.href='index.html'">
            <i class="bi bi-arrow-left"></i> Atrás
        </button>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-sliders"></i> Controles de Imagen
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6" id="divInputImagen">
                                <div class="input-group" >
                                    <input type="file" class="form-control" id="fileInput" accept="image/*">
                                    <label class="input-group-text" for="fileInput">
                                        <i class="bi bi-upload"></i>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="btn-group-custom d-flex gap-2">
                                    <button class="btn btn-success flex-fill" id="cropButton">
                                        <i class="bi bi-scissors"></i> Recortar Imagen
                                    </button>
                                
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Área de imagen y formularios -->
        <div class="row">
            <!-- Imagen -->
            <div class="col-md-12" id="divImagenSeleccionada">
                <div class="card">
                <div class="card-header bg-secondary text-white">
                    <i class="bi bi-image"></i> Vista Previa de la Imagen
                </div>
                <div class="card-body">
                    <div class="image-container">
                    <img id="image" class="img-fluid rounded" style="max-width: 100%; display: none;">
                    <div class="text-center text-muted mt-3" id="image-placeholder">
                        <i class="bi bi-image" style="font-size: 3rem;"></i>
                        <p>No hay imagen seleccionada. Por favor, sube una imagen.</p>
                    </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
        <div class="row">
            <!-- Formularios guardados -->
            <div class="col-md-12">

                <!-- Formulario dinámico -->
                <div class="card mt-3" id="divFormularioDinamico">
                <div class="card-header bg-success text-white">
                    <i class="bi bi-pencil-square"></i> Formulario
                </div>
                <div class="card-body">
                    <div id="formulario-dinamico">
                    <p class="text-muted">Los controles del formulario aparecerán aquí después de recortar la imagen.</p>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Cropper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="procesar.js"></script>
</body>
</html>
