<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Formularios Guardados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./node_modules/@pnotify/core/dist/PNotify.css">
  <link rel="stylesheet" href="./node_modules/@pnotify/bootstrap4/dist/PNotifyBootstrap4.css">
</head>

<body>
<div class="container mt-4">

    <h2 class="mb-4">
        <i class="bi bi-folder-check"></i> Formularios Guardados
    </h2>

    <button class="btn btn-secondary" onclick="window.location.href='index.html'">
        <i class="bi bi-arrow-left"></i> Volver
    </button>

    <div class="card" id="divFormulariosGuardados">
    <div class="card-header bg-info text-white">
        <i class="bi bi-save"></i> Formularios Guardados
    </div>
    

        <div class="card-body">

        <!-- Filtros -->
            <div class="row g-3 align-items-end mb-3">

                <div class="col-md-3">
                <label class="form-label">Desde</label>
                <input type="date" id="fechaDesde" class="form-control">
                </div>

                <div class="col-md-3">
                <label class="form-label">Hasta</label>
                <input type="date" id="fechaHasta" class="form-control">
                </div>

                <div class="col-md-3">
                <label class="form-label">Estado</label>
                <select id="estadoFiltro" class="form-select">
                    <option value="">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmado">Confirmado</option>
                </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                <button id="btnFiltrar" class="btn btn-primary w-50">
                    <i class="bi bi-funnel"></i> Filtrar
                </button>

                <button id="btnExportarCsv" class="btn btn-success w-50">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
                </button>
                </div>

            </div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-bordered table-sm align-middle" id="tablaFormularios">
                <thead class="table-light">
                    <tr>
                    <th>Fecha</th>
                    <th>Acciones</th>
                    <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                    <td colspan="3" class="text-center text-muted">
                        Cargando formularios...
                    </td>
                    </tr>
                </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
<!-- Modal para mostrar la imagen -->
<div class="modal fade" id="modalImagen" tabindex="-1" aria-labelledby="modalImagenLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title" id="modalImagenLabel">Imagen del Formulario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
        <img id="imagenModal" src="" class="img-fluid rounded" alt="Imagen del formulario" 
            style="max-height: 70vh;">
        </div>
        <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <a id="descargarImagen" href="#" class="btn btn-primary" download>
            <i class="bi bi-download"></i> Descargar
        </a>
        </div>
    </div>
    </div>
</div>

<!-- Modal para Analizar la imagen -->
<div class="modal fade" id="modalAnalizarImagen" tabindex="-1" aria-labelledby="modalImagenLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
            <h5 class="modal-title" id="modalImagenLabel">Imagen del Formulario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <img id="imagenModalAnalizar" src="" class="img-fluid rounded" alt="Imagen del formulario" 
                style="max-height: 70vh;">

                <a id="btnAnalizarImagen" href="#" class="btn btn-primary btn-leer-imagen">
                     Procesar Imagen
                </a>
                <hr>
                <div class="mt-2 contenedor-tabla"
                    id="tabla-reprocesada">
                </div>
            </div>
            <div id="loader-ocr" class="text-center my-3" style="display:none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <div class="mt-2">Procesando imagen...</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal para editar-->
<div class="modal fade" id="modalEditarFormulario" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">Editar formulario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body" id="modalEditarBody">
        <!-- contenido dinámico -->
        </div>

        <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardarEdicion">
            Guardar cambios
        </button>
        </div>
    </div>
    </div>
</div>



    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Cropper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="formularios.js"></script>
</body>
</html>
