<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
</head>
<body>
  <div class="container mt-5">

    <div class="text-center mb-5">
      <h2 class="fw-bold">Sistema de Gestión</h2>
      <p class="text-muted">Seleccione una opción para continuar</p>
    </div>

    <div class="row g-4">

      <!-- Procesar Imágenes -->
      <div class="col-md-4">
        <div class="card text-center shadow-lg border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            
            <i class="bi bi-image display-1 text-primary mb-3"></i>

            <h4 class="fw-bold">Procesar Imágenes</h4>
            <p class="text-muted">Cargar y procesar nuevas imágenes mediante OCR</p>

            <button class="btn btn-primary btn-lg mt-3"
                    onclick="window.location.href='procesar.html'">
              Ingresar
            </button>

          </div>
        </div>
      </div>

      <!-- Formularios Guardados -->
      <div class="col-md-4">
        <div class="card text-center shadow-lg border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            
            <i class="bi bi-folder-check display-1 text-success mb-3"></i>

            <h4 class="fw-bold">Formularios Guardados</h4>
            <p class="text-muted">Consultar y editar formularios almacenados</p>

            <button class="btn btn-success btn-lg mt-3"
                    onclick="window.location.href='formularios.html'">
              Ingresar
            </button>

          </div>
        </div>
      </div>

      <!-- Panel de Análisis -->
      <div class="col-md-4">
        <div class="card text-center shadow-lg border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            
            <i class="bi bi-graph-up display-1 text-warning mb-3"></i>

            <h4 class="fw-bold">Panel de Análisis</h4>
            <p class="text-muted">Visualización y análisis estadístico de datos</p>

            <button class="btn btn-warning btn-lg mt-3"
                    onclick="window.location.href='analisis.html'">
              Ingresar
            </button>

          </div>
        </div>
      </div>

    </div>

  </div>

  <!--<button id="btnPython">Ejecutar Python</button>-->

    <!-- Bootstrap JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <!-- Cropper JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
  <script src="renderer.js"></script>
  <script>
    // Script para manejar el placeholder de imagen
    document.addEventListener('DOMContentLoaded', function() {
      const image = document.getElementById('image');
      const imagePlaceholder = document.getElementById('image-placeholder');
      
      // Ocultar placeholder cuando hay una imagen
      image.onload = function() {
        if (image.src && image.src !== window.location.href) {
          imagePlaceholder.style.display = 'none';
          image.style.display = 'block';
        }
      };
      
      // Mostrar placeholder inicialmente
      if (!image.src || image.src === window.location.href) {
        image.style.display = 'none';
        imagePlaceholder.style.display = 'block';
      }
    });

    // Manejar la visualización de imágenes en el modal
    document.addEventListener('DOMContentLoaded', function() {
      // Configurar el modal cuando se abre
      const modalImagen = document.getElementById('modalImagen');
      if (modalImagen) {
        modalImagen.addEventListener('show.bs.modal', function(event) {
          const button = event.relatedTarget; // Botón que activó el modal
          const imagenSrc = button.getAttribute('data-imagen');
          
          // Actualizar la imagen en el modal
          const imagenModal = document.getElementById('imagenModal');
          const descargarBtn = document.getElementById('descargarImagen');
          
          if (imagenSrc) {
            imagenModal.src = imagenSrc;
            descargarBtn.href = imagenSrc;
            
            // Obtener el nombre del archivo para el atributo download
            const fileName = imagenSrc.split('/').pop() || 'imagen_formulario.png';
            descargarBtn.setAttribute('download', fileName);
          }
        });
        
        // Limpiar la imagen cuando se cierra el modal
        modalImagen.addEventListener('hidden.bs.modal', function() {
          const imagenModal = document.getElementById('imagenModal');
          imagenModal.src = '';
        });
      }
    });

  </script>
</body>
</html>
