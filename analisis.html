<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Análisis de Formularios</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-4">

  <h2 class="mb-4">
    <i class="bi bi-graph-up"></i> Panel de Análisis
  </h2>

  <!-- FILTROS -->
  <div class="card mb-4">
    <div class="card-header bg-dark text-white">
      <i class="bi bi-funnel"></i> Filtros
    </div>

    <div class="card-body">
      <div class="row g-3">

        <div class="col-md-3">
          <label class="form-label">Desde</label>
          <input type="date" id="filtroDesde" class="form-control">
        </div>

        <div class="col-md-3">
          <label class="form-label">Hasta</label>
          <input type="date" id="filtroHasta" class="form-control">
        </div>

        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select id="filtroTipo" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Producto</label>
          <select id="filtroProducto" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" id="btnFiltrar">
            <i class="bi bi-search"></i> Filtrar
          </button>
        </div>

        <div class="col-md-12 d-flex gap-2 mt-3">
          <button class="btn btn-success" id="btnExportarCSV">
            <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
          </button>

          <button class="btn btn-secondary" onclick="window.location.href='index.html'">
            <i class="bi bi-arrow-left"></i> Volver
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- GRAFICO -->
  <div class="card mb-4">
    <div class="card-header bg-info text-white">
      <i class="bi bi-bar-chart"></i> Evolución de Precio
    </div>
    <div class="card-body">
      <canvas id="graficoPrecios" height="100"></canvas>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card">
    <div class="card-header bg-secondary text-white">
      <i class="bi bi-table"></i> Resultados
    </div>
    <div class="card-body table-responsive">
      <table class="table table-striped" id="tablaResultados">
        <thead>
          <tr>
            <th>Periodo</th>
            <th>Formulario</th>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tu JS -->
<script src="analisis.js"></script>

</body>
</html>
